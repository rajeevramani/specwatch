              $ref: '#/components/schemas/LineItemUpdate'
            example:
              sku: WIDGET-Z
              quantity: 4
              unit_price: 550
      responses:
        '200':
          description: The line item was updated. The full resource is returned.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
                description: Maximum requests permitted in the window.
                example: 1000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItem'
              example:
                id: li_003
                order_id: ord_002
                sku: WIDGET-Z
                quantity: 4
                unit_price: 550
        '400':
          description: The request body or parameters were invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/invalid-body
                title: Invalid request body
                status: 400
                detail: name and email are required
                code: invalid_body
        '404':
          description: The requested resource does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/not-found
                title: Resource not found
                status: 404
                detail: No resource exists with the supplied identifier.
                code: not_found
        '429':
          description: The client has exceeded its rate-limit quota.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
                description: Maximum requests permitted in the window.
                example: 1000
            RateLimit-Remaining:
              description: The number of requests remaining in the current window.
              schema:
                type: integer
                format: int32
                description: Requests remaining in the window.
                example: 0
            RateLimit-Reset:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                format: int32
                description: Seconds until the window resets.
                example: 60
            Retry-After:
              description: Seconds the client should wait before retrying.
              schema:
                type: integer
                format: int32
                description: Seconds to wait before retrying.
                example: 30
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/rate-limited
                title: Too many requests
                status: 429
                detail: Rate limit exceeded. Retry after the indicated delay.
                code: rate_limited
        '500':
          description: An unexpected error occurred while processing the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/internal-error
                title: Internal server error
                status: 500
                detail: An unexpected error occurred.
                code: internal_error
