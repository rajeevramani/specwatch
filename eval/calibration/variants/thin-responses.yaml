    put:
      tags:
        - Customers
      operationId: updateCustomer
      summary: Update a customer
      description: >
        Replaces the mutable fields (name and email) of an existing customer and returns the
        complete updated resource. Both fields are required; this is a full replacement rather than
        a partial patch.
      parameters:
        - name: customerId
          in: path
          required: true
          description: The unique identifier of a customer, e.g. "cus_001".
          schema:
            type: string
            description: A customer identifier.
            example: cus_001
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Optional client-generated key that makes this mutating request safe to retry.
          schema:
            type: string
            format: uuid
            description: A unique idempotency key, typically a UUID.
            example: 1f0c3a9e-2b6d-4d7a-9d1e-2a3b4c5d6e7f
      requestBody:
        required: true
        description: The replacement customer fields.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
            example:
              name: E. Dijkstra
              email: edsger@example.com
      responses:
