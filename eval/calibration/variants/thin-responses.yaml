  /orders:
    get:
      tags:
        - Orders
      operationId: listOrders
      summary: List orders
      description: >
        Returns orders ordered by identifier. Pass customer_id to return only the orders belonging
        to a single customer. Supports limit/offset pagination.
      parameters:
        - name: customer_id
          in: query
          required: false
          description: Restrict the result to orders belonging to this customer identifier.
          schema:
            type: string
            description: A customer identifier such as "cus_001".
            example: cus_001
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return. Omit to return the full collection.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            description: The page size.
            example: 50
        - name: offset
          in: query
          required: false
          description: Number of records to skip before collecting the page of results.
          schema:
            type: integer
            format: int32
            minimum: 0
            description: The zero-based offset into the collection.
            example: 0
      responses:
        '200':
          description: The collection of orders.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
                description: Maximum requests permitted in the window.
                example: 1000
          content:
            application/json:
              schema:
                type: array
                description: An ordered list of order records.
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - id: ord_001
                  customer_id: cus_001
                  status: paid
                  created_at: '2026-01-01T00:00:00.000Z'
                - id: ord_002
                  customer_id: cus_001
                  status: pending
                  created_at: '2026-01-01T00:00:00.000Z'
        '429':
          description: The client has exceeded its rate-limit quota.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
