components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Bearer token authentication. Supply an opaque API token in the Authorization header as
        "Bearer <token>". The calibration backend accepts any token value; authentication is
        documented for realism.
  schemas:
    Health:
      type: object
      required:
        - status
        - thinResponses
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        thinResponses:
          type: boolean
          example: false
    Customer:
      type: object
      required:
        - id
        - name
        - email
        - created_at
      properties:
        id:
          type: string
          example: cus_001
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
        created_at:
          type: string
          format: date-time
          example: '2026-01-01T00:00:00.000Z'
    CustomerCreate:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: Edsger Dijkstra
        email:
          type: string
          format: email
          example: edsger@example.com
    Order:
      type: object
      required:
        - id
        - customer_id
        - status
        - created_at
      properties:
        id:
          type: string
          example: ord_001
        customer_id:
          type: string
          example: cus_001
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time
          example: '2026-01-01T00:00:00.000Z'
    OrderCreate:
      type: object
      required:
        - customer_id
      properties:
        customer_id:
          type: string
          example: cus_001
        status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
          default: pending
    OrderUpdate:
      type: object
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
    OrderStatus:
      type: string
      enum:
        - pending
        - paid
        - shipped
        - cancelled
      example: pending
    LineItem:
      type: object
      required:
        - id
        - order_id
        - sku
        - quantity
        - unit_price
      properties:
        id:
          type: string
          example: li_001
        order_id:
          type: string
          example: ord_001
        sku:
          type: string
          example: WIDGET-A
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 2
        unit_price:
          type: integer
          format: int32
          minimum: 0
          example: 1500
    LineItemCreate:
      type: object
      required:
        - order_id
        - sku
        - quantity
        - unit_price
      properties:
        order_id:
          type: string
          example: ord_002
        sku:
          type: string
          example: WIDGET-Z
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 3
        unit_price:
          type: integer
          format: int32
          minimum: 0
          example: 500
    LineItemUpdate:
      type: object
      required:
        - sku
        - quantity
        - unit_price
      properties:
        sku:
          type: string
          example: WIDGET-Z
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 4
        unit_price:
          type: integer
          format: int32
          minimum: 0
          example: 550
    Problem:
      type: object
      required:
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: https://api.calibration.local/problems/not-found
        title:
          type: string
          example: Resource not found
        status:
          type: integer
          format: int32
          example: 404
        detail:
          type: string
          example: No resource exists with the supplied identifier.
        code:
          type: string
          example: not_found
