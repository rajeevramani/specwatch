            description: A customer identifier.
            example: cus_001
      responses:
        '200':
          description: The requested customer.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
                description: Maximum requests permitted in the window.
                example: 1000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: cus_001
                name: Ada Lovelace
                email: ada@example.com
                created_at: '2026-01-01T00:00:00.000Z'
        '404':
          description: The requested resource does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/not-found
