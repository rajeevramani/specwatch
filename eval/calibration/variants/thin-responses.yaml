    delete:
      tags:
        - Customers
      operationId: deleteCustomer
      summary: Delete a customer
      description: >
        Permanently deletes a customer. Cascades to the customer's orders and their line items.
        Returns no content on success.
      parameters:
        - name: customerId
          in: path
          required: true
          description: The unique identifier of a customer, e.g. "cus_001".
          schema:
            type: string
            description: A customer identifier.
            example: cus_001
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional client-generated key that makes this deletion safe to retry.
          schema:
            type: string
            format: uuid
            description: A unique idempotency key, typically a UUID.
            example: 1f0c3a9e-2b6d-4d7a-9d1e-2a3b4c5d6e7f
      responses:
        '204':
          description: The customer was deleted. No body is returned.
        '404':
          description: The requested resource does not exist.
          content:
