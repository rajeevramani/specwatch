                status: 429
                detail: Rate limit exceeded. Retry after the indicated delay.
                code: rate_limited
        '500':
          description: An unexpected error occurred while processing the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/internal-error
                title: Internal server error
                status: 500
                detail: An unexpected error occurred.
                code: internal_error
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Create an order
      description: >
        Places a new order for an existing customer and returns the complete created order,
        including its server-assigned identifier, status, and creation timestamp. The referenced
        customer must already exist. If no status is supplied the order defaults to "pending".
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional client-generated key that makes this mutating request safe to retry.
          schema:
            type: string
            format: uuid
            description: A unique idempotency key, typically a UUID.
            example: 1f0c3a9e-2b6d-4d7a-9d1e-2a3b4c5d6e7f
      requestBody:
        required: true
        description: The order to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
            example:
              customer_id: cus_001
              status: pending
      responses:
        '201':
          description: The order was created. The full resource is returned.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
                description: Maximum requests permitted in the window.
                example: 1000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: ord_004
                customer_id: cus_001
                status: pending
                created_at: '2026-06-05T12:00:00.000Z'
        '400':
