openapi: 3.1.0
info:
  title: Calibration Orders API
  version: 1.0.0
  description: >
    Thin REST CRUD API for the JAIRF calibration harness. Models a small commerce domain — customers
    place orders, and orders contain line items. This is the hand-authored "gold" specification:
    every operation, parameter, and schema is fully described, carries request/response examples,
    returns a standardized problem-details error body, and documents the complete resource
    representation on write. It is the high-quality baseline against which single-signal ablations
    are measured.
  contact:
    name: Calibration Harness
    url: https://github.com/rajeevramani/specwatch
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
externalDocs:
  description: Calibration harness design and methodology.
  url: https://github.com/rajeevramani/specwatch/blob/main/eval/calibration/README.md
servers:
  - url: https://api.calibration.local
    description: Calibration backend. The local harness reverse-proxies this to http://localhost:8787.
security:
  - bearerAuth: []
tags:
  - name: Customers
    description: Manage customer records.
  - name: Orders
    description: Manage orders placed by customers.
  - name: LineItems
    description: Manage the line items that belong to an order.
  - name: System
    description: Service health and operational endpoints.
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Get service health
      description: >
        Returns a liveness payload reporting whether the service is up and whether the
        response-completeness toggle is active. Useful as a readiness probe before issuing other
        requests.
      security: []
      responses:
        '200':
          description: The service is healthy.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
                description: Maximum requests permitted in the window.
                example: 1000
            RateLimit-Remaining:
              description: The number of requests remaining in the current window.
              schema:
                type: integer
                format: int32
                description: Requests remaining in the window.
                example: 999
            RateLimit-Reset:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                format: int32
                description: Seconds until the window resets.
                example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                thinResponses: false
        '429':
          description: The client has exceeded its rate-limit quota.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
                description: Maximum requests permitted in the window.
                example: 1000
            RateLimit-Remaining:
              description: The number of requests remaining in the current window.
              schema:
                type: integer
                format: int32
                description: Requests remaining in the window.
                example: 0
            RateLimit-Reset:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                format: int32
                description: Seconds until the window resets.
                example: 60
            Retry-After:
              description: Seconds the client should wait before retrying.
              schema:
                type: integer
                format: int32
                description: Seconds to wait before retrying.
                example: 30
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/rate-limited
                title: Too many requests
                status: 429
                detail: Rate limit exceeded. Retry after the indicated delay.
                code: rate_limited
        '500':
          description: An unexpected error occurred while processing the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/internal-error
                title: Internal server error
                status: 500
                detail: An unexpected error occurred.
                code: internal_error
  /customers:
    get:
      tags:
        - Customers
      operationId: listCustomers
      summary: List customers
      description: >
        Returns the full collection of customers ordered by identifier. Supports optional
        limit/offset pagination so agents can page through large result sets predictably.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return. Omit to return the full collection.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            description: The page size.
            example: 50
        - name: offset
          in: query
          required: false
          description: Number of records to skip before collecting the page of results.
          schema:
            type: integer
            format: int32
            minimum: 0
            description: The zero-based offset into the collection.
            example: 0
      responses:
        '200':
          description: The collection of customers.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
                description: Maximum requests permitted in the window.
                example: 1000
            RateLimit-Remaining:
              description: The number of requests remaining in the current window.
              schema:
                type: integer
                format: int32
                description: Requests remaining in the window.
                example: 999
            RateLimit-Reset:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                format: int32
                description: Seconds until the window resets.
                example: 60
          content:
            application/json:
              schema:
                type: array
                description: An ordered list of customer records.
                items:
                  $ref: '#/components/schemas/Customer'
              example:
                - id: cus_001
                  name: Ada Lovelace
                  email: ada@example.com
                  created_at: '2026-01-01T00:00:00.000Z'
                - id: cus_002
                  name: Alan Turing
                  email: alan@example.com
                  created_at: '2026-01-01T00:00:00.000Z'
        '429':
          description: The client has exceeded its rate-limit quota.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
                description: Maximum requests permitted in the window.
                example: 1000
            RateLimit-Remaining:
              description: The number of requests remaining in the current window.
              schema:
                type: integer
                format: int32
                description: Requests remaining in the window.
                example: 0
            RateLimit-Reset:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                format: int32
                description: Seconds until the window resets.
                example: 60
            Retry-After:
              description: Seconds the client should wait before retrying.
              schema:
                type: integer
                format: int32
                description: Seconds to wait before retrying.
                example: 30
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/rate-limited
                title: Too many requests
                status: 429
                detail: Rate limit exceeded. Retry after the indicated delay.
                code: rate_limited
        '500':
          description: An unexpected error occurred while processing the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/internal-error
                title: Internal server error
                status: 500
                detail: An unexpected error occurred.
                code: internal_error
    post:
      tags:
        - Customers
      operationId: createCustomer
      summary: Create a customer
      description: >
        Creates a new customer record and returns the complete created resource, including its
        server-assigned identifier and creation timestamp. The email address must be unique across
        all customers.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Optional client-generated key that makes this mutating request safe to retry. Supplying
            the same key replays the original outcome instead of applying the change twice.
          schema:
            type: string
            format: uuid
            description: A unique idempotency key, typically a UUID.
            example: 1f0c3a9e-2b6d-4d7a-9d1e-2a3b4c5d6e7f
      requestBody:
        required: true
        description: The customer to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
            example:
              name: Edsger Dijkstra
              email: edsger@example.com
      responses:
        '201':
          description: The customer was created. The full resource is returned.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
                description: Maximum requests permitted in the window.
                example: 1000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: cus_004
                name: Edsger Dijkstra
                email: edsger@example.com
                created_at: '2026-06-05T12:00:00.000Z'
        '400':
          description: The request body or parameters were invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/invalid-body
                title: Invalid request body
                status: 400
                detail: name and email are required
                code: invalid_body
        '409':
          description: The request conflicts with the current state, e.g. a duplicate email.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/conflict
                title: Resource conflict
                status: 409
                detail: A customer with this email already exists.
                code: conflict
        '429':
          description: The client has exceeded its rate-limit quota.
          headers:
            RateLimit-Limit:
              description: The request quota for the current rate-limit window.
              schema:
                type: integer
                format: int32
                description: Maximum requests permitted in the window.
                example: 1000
            RateLimit-Remaining:
              description: The number of requests remaining in the current window.
              schema:
                type: integer
                format: int32
                description: Requests remaining in the window.
                example: 0
            RateLimit-Reset:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                format: int32
                description: Seconds until the window resets.
                example: 60
            Retry-After:
              description: Seconds the client should wait before retrying.
              schema:
                type: integer
                format: int32
                description: Seconds to wait before retrying.
                example: 30
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/rate-limited
                title: Too many requests
                status: 429
                detail: Rate limit exceeded. Retry after the indicated delay.
                code: rate_limited
        '500':
          description: An unexpected error occurred while processing the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.calibration.local/problems/internal-error
                title: Internal server error
                status: 500
                detail: An unexpected error occurred.
                code: internal_error
