components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Bearer token authentication. Supply an opaque API token in the Authorization header as
        "Bearer <token>". The calibration backend accepts any token value; authentication is
        documented for realism.
  schemas:
    Health:
      type: object
      required:
        - status
        - thinResponses
      properties:
        status:
          type: string
          enum:
            - ok
        thinResponses:
          type: boolean
    Customer:
      type: object
      required:
        - id
        - name
        - email
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    CustomerCreate:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
          format: email
    Order:
      type: object
      required:
        - id
        - customer_id
        - status
        - created_at
      properties:
        id:
          type: string
        customer_id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time
    OrderCreate:
      type: object
      required:
        - customer_id
      properties:
        customer_id:
          type: string
        status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
          default: pending
    OrderUpdate:
      type: object
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
    OrderStatus:
      type: string
      enum:
        - pending
        - paid
        - shipped
        - cancelled
    LineItem:
      type: object
      required:
        - id
        - order_id
        - sku
        - quantity
        - unit_price
      properties:
        id:
          type: string
        order_id:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        unit_price:
