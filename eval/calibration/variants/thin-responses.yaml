components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Bearer token authentication. Supply an opaque API token in the Authorization header as
        "Bearer <token>". The calibration backend accepts any token value; authentication is
        documented for realism.
  schemas:
    Health:
      type: object
      description: Liveness payload reporting service status and toggle state.
      required:
        - status
        - thinResponses
      properties:
        status:
          type: string
          description: Service status indicator; "ok" when the service is healthy.
          enum:
            - ok
          example: ok
        thinResponses:
          type: boolean
          description: Whether the response-completeness toggle is currently active.
          example: false
    Customer:
      type: object
      description: A customer who can place orders.
      required:
        - id
        - name
        - email
        - created_at
      properties:
        id:
          type: string
          description: The server-assigned unique identifier, e.g. "cus_001".
          example: cus_001
        name:
          type: string
          description: The customer's display name.
          example: Ada Lovelace
        email:
          type: string
          format: email
          description: The customer's email address. Unique across all customers.
          example: ada@example.com
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp of when the customer was created.
          example: '2026-01-01T00:00:00.000Z'
    CustomerCreate:
      type: object
      description: The fields required to create or replace a customer.
      required:
        - name
        - email
      properties:
        name:
          type: string
          description: The customer's display name.
          example: Edsger Dijkstra
        email:
          type: string
          format: email
          description: The customer's email address. Must be unique across all customers.
          example: edsger@example.com
    Order:
      type: object
      description: An order placed by a customer.
      required:
        - id
        - customer_id
        - status
        - created_at
      properties:
        id:
          type: string
          description: The server-assigned unique identifier, e.g. "ord_001".
          example: ord_001
        customer_id:
          type: string
          description: The identifier of the customer who owns this order.
          example: cus_001
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp of when the order was created.
          example: '2026-01-01T00:00:00.000Z'
    OrderCreate:
      type: object
      description: The fields required to create an order.
      required:
        - customer_id
      properties:
        customer_id:
          type: string
          description: The identifier of an existing customer to place the order for.
          example: cus_001
        status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
          description: The initial order status. Defaults to "pending" when omitted.
          default: pending
    OrderUpdate:
      type: object
      description: The fields required to update an order's status.
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
          description: The new status to assign to the order.
    OrderStatus:
      type: string
      description: The lifecycle status of an order.
      enum:
        - pending
        - paid
        - shipped
        - cancelled
      example: pending
    LineItem:
      type: object
      description: A single line item belonging to an order.
      required:
        - id
        - order_id
        - sku
        - quantity
        - unit_price
      properties:
        id:
          type: string
          description: The server-assigned unique identifier, e.g. "li_001".
          example: li_001
        order_id:
          type: string
          description: The identifier of the order this line item belongs to.
          example: ord_001
        sku:
          type: string
          description: The stock-keeping unit of the product.
          example: WIDGET-A
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: The number of units ordered. A positive integer.
          example: 2
        unit_price:
          type: integer
          format: int32
          minimum: 0
          description: The price per unit in minor currency units (e.g. cents).
          example: 1500
    LineItemCreate:
      type: object
      description: The fields required to create a line item.
      required:
        - order_id
        - sku
        - quantity
        - unit_price
      properties:
        order_id:
          type: string
          description: The identifier of an existing order to add the line item to.
          example: ord_002
        sku:
          type: string
          description: The stock-keeping unit of the product.
          example: WIDGET-Z
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: The number of units. A positive integer.
          example: 3
        unit_price:
          type: integer
          format: int32
          minimum: 0
          description: The price per unit in minor currency units (e.g. cents).
          example: 500
    LineItemUpdate:
      type: object
      description: The replaceable fields of a line item.
      required:
        - sku
        - quantity
        - unit_price
      properties:
        sku:
          type: string
          description: The stock-keeping unit of the product.
          example: WIDGET-Z
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: The number of units. A positive integer.
          example: 4
        unit_price:
          type: integer
          format: int32
          minimum: 0
          description: The price per unit in minor currency units (e.g. cents).
          example: 550
    Problem:
      type: object
      description: >
        A standardized problem-details error body following RFC 9457 (application/problem+json).
        Conveys a machine-readable error type and a human-readable explanation.
      required:
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
          example: https://api.calibration.local/problems/not-found
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Resource not found
        status:
          type: integer
          format: int32
          description: The HTTP status code for this occurrence of the problem.
          example: 404
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
          example: No resource exists with the supplied identifier.
        code:
          type: string
          description: A stable, machine-readable error code emitted by the backend.
          example: not_found
